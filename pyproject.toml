[project]
name = "dresscode"
version = "0.1.0"
description = "Diff-bound review questions for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "rich>=15.0.0",
    "tomlkit>=0.15.2",
    "typer>=0.27.3",
]

[project.scripts]
dresscode = "dresscode.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dresscode*"]

[tool.setuptools.package-data]
dresscode = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["dresscode"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["openspec"]

[tool.ty.rules]
all = "error"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
