schema: spec-driven

context: |
  DressCode is a CLI that tracks recurring AI coding-agent mistakes as boolean
  questions with sealed expected answers, hands them to a fresh-context reviewer
  after implementation, and gates hand-over until every question is answered as
  expected or the violation is waived with a reason. Fresh-context review is
  required by AGENTS.md or the harness, not verified by the CLI; reviewer
  freshness is reported as unverified, and check --strict rejects waivers only.

  Implementation: Python with `uv`, `typer` + `rich`, `ruff` + `ty` + `pytest`,
  shaped like the `metronome` CLI. State is a global store keyed by repo and
  branch; config is layered (private per-repo, repo-local `.dresscode/`, global).
  The repo currently contains planning artifacts only.
